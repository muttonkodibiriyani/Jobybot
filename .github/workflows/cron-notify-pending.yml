name: Notify pending orders & refunds (every 30 min)

# Runs every 30 minutes, 24x7, from GitHub's servers — completely free.
# Pings https://jobybots.com/api/cron/notify-pending which sends you the
# pending-queue email if there are any orders/refunds waiting.
#
# Why GitHub Actions instead of Vercel Cron?
# Vercel's free "Hobby" plan only allows one cron run per day. GitHub
# Actions has no such limit for public repos, so we use it for the
# every-30-min ping and keep Vercel Cron as a daily safety net.

on:
  schedule:
    # cron is in UTC. */30 = at minute 0 and 30 of every hour.
    - cron: "*/30 * * * *"
  # Lets you trigger a test run manually from the GitHub Actions tab.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call notify-pending endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://jobybots.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set in this repo. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          response=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/notify-pending")
          echo "HTTP ${response}"
          cat /tmp/body || true
          echo
          if [ "${response}" != "200" ]; then
            echo "::error::Cron endpoint returned HTTP ${response}"
            exit 1
          fi
